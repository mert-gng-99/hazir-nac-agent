services:
  - type: web
    name: hazir-nac-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      # With no key the app falls back to its deterministic simulator, so a
      # blueprint deploy still just works. Add NAC_RAPIDAPI_KEY to switch on
      # the official Nokia NaC sandbox adapter.
      - key: NAC_MODE
        value: nokia-sandbox
      - key: NAC_DEV_MODE
        value: "true"
      - key: DB_PATH
        value: /tmp/ledger.db
      # Set these in the Render dashboard to switch on the live gateway or the
      # Gemini planner. All are optional; the app runs without any of them.
      # The Gemini planner needs AGENT_PROVIDER=gemini *and* a key.
      - key: NAC_RAPIDAPI_KEY
        sync: false
      - key: AGENT_PROVIDER
        sync: false
      - key: GEMINI_API_KEY
        sync: false
